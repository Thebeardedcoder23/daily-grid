<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Daily Grid</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar"><div><div class="eyebrow">A SMALL CROSSWORD</div><h1>Daily Grid</h1></div><div id="timer">0:00</div></header>
<main>
<section class="game">
<div id="grid" class="grid" role="application" aria-label="Crossword grid"></div>
<div id="activeClue" class="active-clue" aria-live="polite"></div>
<div class="controls"><button id="prev" type="button">←</button><button id="next" type="button">→</button><button id="check" type="button">Check</button></div>
<input id="mobileInput" class="mobile-input" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-label="Type crossword letters">
</section>
<section class="clues">
<div><h2>Across</h2><ol id="across"></ol></div>
<div><h2>Down</h2><ol id="down"></ol></div>
</section>
</main>
<div id="toast" class="toast" aria-live="polite"></div>
<div id="reveal" class="reveal" hidden>
<div class="reveal-card">
<div class="reveal-kicker">ONE LAST THING</div>
<div id="revealText" class="reveal-text" aria-live="assertive"></div>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
